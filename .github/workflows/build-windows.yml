name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install requests beautifulsoup4 selenium webdriver-manager

      - name: Install Chrome for Selenium
        run: |
          choco install googlechrome -y

      - name: Run tests
        run: python -m pytest

      - name: Build GUI executable
        run: pyinstaller --noconfirm --onefile --windowed --paths src --name GameHubManager src/gamehub_manager/app.py

      - name: Build CLI executable
        run: pyinstaller --noconfirm --onefile --paths src --name GameHubManagerCLI manager.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GameHubManager-windows
          path: |
            dist/GameHubManager.exe
            dist/GameHubManagerCLI.exe
